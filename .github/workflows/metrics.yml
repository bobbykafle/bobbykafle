
name: GitHub Stats

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Generate GitHub Stats
        uses: anuraghazra/github-readme-stats@v0.2.0
        with:
          username: bobbykafle
          include_all_commits: true
          count_private: true
          token: ${{ secrets.GH_TOKEN }}
