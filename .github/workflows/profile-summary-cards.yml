name: GitHub-Profile-Summary-Cards

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-cards

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: vn7n24fzkq/github-profile-summary-cards@v0.11.6
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}

        with:
          USERNAME: ${{ github.repository_owner }}

          # Nepal time (UTC +5:45)
          UTC_OFFSET: 5.75

          # Generate the 2077 theme
          THEME: "2077"

          # Animate the cards
          ANIMATION: "draw"

          # Animation duration in seconds
          DURATION: "3"

          # Name shown on the profile details card
          NAME: "bobbykafle (Babita)"
